<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Microsoft 付款方式问题截图</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #24292f;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.3;
    }

    .summary {
      max-width: 900px;
      margin: 0;
      color: #57606a;
      font-size: 16px;
    }

    .summary strong {
      color: #24292f;
    }

    section {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid #d0d7de;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 21px;
      line-height: 1.4;
    }

    section p {
      margin: 0 0 16px;
      color: #57606a;
    }

    a {
      color: #0969da;
    }

    figure {
      margin: 0;
    }

    figure a {
      display: block;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
    }

    figcaption {
      margin-top: 8px;
      color: #6e7781;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 24px, 1200px);
        padding-top: 28px;
      }

      h1 {
        font-size: 24px;
      }

      section {
        margin-top: 30px;
        padding-top: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Microsoft 付款方式问题截图</h1>
    <p class="summary">
      <strong>问题说明：</strong>我无法删除尾号为 6051 的过期 Visa 卡。
      Microsoft 账户提示该付款方式与 Azure 订阅相关，需要在 Azure 门户中删除；
      但 Azure 门户的“付款方式”页面无法获取付款方式，登录时还出现租户账户错误。
    </p>

    <section>
      <h2>1. Microsoft 账户提示无法删除银行卡</h2>
      <p>
        相关页面：
        <a
          href="https://account.microsoft.com/billing/payments?fref=home.drawers.payment-options.manage-expired-payment"
          target="_blank"
          rel="noopener noreferrer"
        >Microsoft 账户付款选项</a>
      </p>
      <figure>
        <a href="./microsoft-payment.webp" target="_blank">
          <img
            src="./microsoft-payment.webp"
            alt="Microsoft 账户提示无法删除尾号 6051 的 Visa 卡"
            width="1917"
            height="1002"
            decoding="async"
          >
        </a>
        <figcaption>点击图片可查看原尺寸。</figcaption>
      </figure>
    </section>

    <section>
      <h2>2. Azure 门户无法获取付款方式</h2>
      <p>
        相关页面：
        <a
          href="https://portal.azure.com/#view/Microsoft_Azure_Billing/BillingMenuBlade/~/Payment"
          target="_blank"
          rel="noopener noreferrer"
        >Azure 成本管理与计费－付款方式</a>
      </p>
      <figure>
        <a href="./azure-billing.webp" target="_blank">
          <img
            src="./azure-billing.webp"
            alt="Azure 门户显示未能获取付款方式"
            width="1909"
            height="1011"
            loading="lazy"
            decoding="async"
          >
        </a>
        <figcaption>页面提示：未能获取付款方式，请稍后重试。</figcaption>
      </figure>
    </section>

    <section>
      <h2>3. 登录时出现 Microsoft Services 租户错误</h2>
      <figure>
        <a href="./account-error.webp" target="_blank">
          <img
            src="./account-error.webp"
            alt="登录时提示所选用户账户在 Microsoft Services 租户中不存在"
            width="607"
            height="510"
            loading="lazy"
            decoding="async"
          >
        </a>
        <figcaption>登录或切换账户时出现的错误提示。</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
